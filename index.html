<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  * {
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
  }

  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffd6e8, #e6f0ff);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .card {
    background: rgba(255,255,255,0.96);
    width: 90%;
    max-width: 380px;
    padding: 28px;
    border-radius: 22px;
    text-align: center;
    box-shadow: 0 20px 45px rgba(0,0,0,0.18);
    animation: pop 0.8s ease;
    position: relative;
    z-index: 2;
  }

  h1 {
    font-size: 22px;
    color: #ff4d6d;
    margin-bottom: 15px;
  }

  p {
    font-size: 15px;
  }

  button {
    padding: 12px 26px;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    margin: 10px;
    cursor: pointer;
    transition: 0.3s;
  }

  .yes {
    background: #ff4d6d;
    color: white;
  }

  .no {
    background: #e0e0e0;
  }

  button:hover {
    transform: scale(1.06);
  }

  .messages {
    text-align: left;
    margin-top: 15px;
  }

  .bubble {
    background: #ffe6ee;
    padding: 10px 14px;
    border-radius: 14px;
    margin-bottom: 8px;
    font-size: 15px;
    animation: fade 0.4s ease;
  }

  img {
    width: 220px;
    margin-top: 18px;
    border-radius: 18px;
  }

  /* floating hearts */
  .heart {
    position: absolute;
    bottom: -10px;
    color: #ff4d6d;
    font-size: 18px;
    animation: float 6s linear infinite;
    opacity: 0.7;
  }

  @keyframes pop {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  @keyframes fade {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes float {
    from { transform: translateY(0); opacity: 0.7; }
    to { transform: translateY(-110vh); opacity: 0; }
  }
</style>
</head>

<body>

<div class="card" id="box">
  <h1>Will you be my Valentine? 🫣💗</h1>

  <button class="yes" onclick="yesClick()">Yes 💕</button>
  <button class="no" onclick="noClick()">No 🙄</button>

  <div class="messages" id="msgs"></div>
</div>

<script>
  /* NO OPTION — SAME AS BEFORE */
  const noTexts = [
    "Ashtee bedhoo yaroo sikartalee 😏",
    "Stfu 🙄",
    "Promises don't last 🫡",
    "ik u always luv ur i20 babe onlyy 😭"
  ];

  let index = 0;

  function noClick() {
    if (index < noTexts.length) {
      const msgBox = document.getElementById("msgs");
      const div = document.createElement("div");
      div.className = "bubble";
      div.innerText = noTexts[index];
      msgBox.prepend(div);
      index++;
    }
  }

  /* YES OPTION */
  function yesClick() {
    document.getElementById("box").innerHTML = `
      <h1>yayyy!ur always minee boboo❤️‍🩹🥹🫂</h1>
      <p>(Unfortunately u lost ur freedom 😂🫣)</p>

      <!-- CUTE LOVE-RELATED GIF -->
      <img src="https://media.giphy.com/media/11k3oaUjSlFR4I/giphy.gif">
    `;
    startHearts();
  }

  /* hearts magic */
  function startHearts() {
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "💗";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (16 + Math.random() * 10) + "px";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 6000);
    }, 450);
  }
</script>

</body>
</html>
