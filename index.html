<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💖</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffdee9, #b5fffc);
      overflow: hidden;
    }
    .card {
      background: rgba(255,255,255,0.9);
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      width: 85%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      animation: fadeIn 1s ease;
    }
    h1 {
      color: #ff4d6d;
    }
    button {
      padding: 12px 25px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      margin: 10px;
      cursor: pointer;
    }
    .yes {
      background: #ff4d6d;
      color: white;
    }
    .no {
      background: #ccc;
    }
    img {
      width: 200px;
      margin-top: 15px;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: scale(0.9);}
      to {opacity: 1; transform: scale(1);}
    }
  </style>
</head>
<body>

<div class="card" id="box">
  <h1>Will you be my Valentine? 🫣💗</h1>
  <button class="yes" onclick="yesClick()">Yes 💕</button>
  <button class="no" onclick="noClick()">No 🙄</button>
</div>

<script>
function noClick() {
  document.getElementById("box").innerHTML = `
    <h1>😏</h1>
    <p>Ashtee bedhoo yaroo sikartalee 😏</p>
    <p>Stfu 🙄</p>
    <p>Promises don't last 🫡</p>
    <p>ik u always luv ur i20 onlyy 😭</p>
  `;
}

function yesClick() {
  document.getElementById("box").innerHTML = `
    <h1>Yayyyy ur minee boboo ❤️‍🩹🫣🪬</h1>
    <img src="https://media.tenor.com/2roX3uxz_68AAAAC/cat-kiss.gif" alt="cute cat kiss">
  `;
}
</script>

</body>
</html>
