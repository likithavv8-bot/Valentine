<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine 💖</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffd1dc, #ffe6f0);
      font-family: 'Segoe UI', sans-serif;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 18px;
      text-align: center;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 22px;
      margin: 10px;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .yes {
      background-color: #ff4d6d;
      color: white;
    }

    .no {
      background-color: #e0e0e0;
    }

    button:hover {
      transform: scale(1.08);
    }

    .msgs p {
      margin: 6px 0;
      font-size: 14px;
    }

    img {
      width: 220px;
      margin-top: 15px;
      border-radius: 15px;
    }
  </style>
</head>
<body>

<div class="box" id="box">
  <h1>Will you be my Valentine? 💌</h1>

  <button class="yes" onclick="yesClick()">Yes 💖</button>
  <button class="no" onclick="noClick()">No 🙄</button>

  <div class="msgs" id="msgs"></div>
</div>

<script>
  const noLines = [
    "Ashtee bedhoo yaroo sikartalee 😏",
    "Stfu 🙄",
    "Promises don't last 🫡",
    "ik u always luv ur i20 babee onlyy 😭"
  ];
  let i = 0;

  function noClick() {
    if (i < noLines.length) {
      const p = document.createElement("p");
      p.innerText = noLines[i];
      document.getElementById("msgs").appendChild(p);
      i++;
    }
  }

  function yesClick() {
    document.getElementById("box").innerHTML = `
      <h1>yayyy!Ur always minee boboo❤️‍🩹🥹🫂</h1>
      <p>(Unfortunately u lost ur freedom 😂🫣)</p>

      <!-- LOVE-RELATED CUTE GIF -->
      <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" alt="love gif">
    `;
  }
</script>

</body>
</html>
