<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine 💖</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .card {
      background: rgba(255,255,255,0.9);
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 320px;
      animation: pop 0.8s ease;
    }

    h1 {
      color: #ff4d6d;
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 20px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .yes {
      background: #ff4d6d;
      color: white;
    }

    .no {
      background: #ddd;
    }

    button:hover {
      transform: scale(1.1);
    }

    .messages p {
      margin: 5px 0;
      animation: fadeIn 0.5s ease;
    }

    img {
      width: 200px;
      border-radius: 15px;
      margin-top: 15px;
    }

    .heart {
      position: absolute;
      color: rgba(255,255,255,0.7);
      font-size: 20px;
      animation: float 6s infinite ease-in;
    }

    @keyframes float {
      from {
        transform: translateY(100vh);
        opacity: 1;
      }
      to {
        transform: translateY(-10vh);
        opacity: 0;
      }
    }

    @keyframes pop {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

<div class="card" id="card">
  <h1>Will you be my Valentine? 💌</h1>
  <button class="yes" onclick="yesClick()">Yes 💖</button>
  <button class="no" onclick="noClick()">No 🙄</button>
  <div class="messages" id="messages"></div>
</div>

<script>
  const noTexts = [
    "Ashtee bedhoo yaroo sikartalee 😏",
    "Stfu 🙄",
    "Promises don't last 🫡",
    "ik u always luv ur i20 onlyy 😭"
  ];
  let noIndex = 0;

  function noClick() {
    if (noIndex < noTexts.length) {
      const p = document.createElement("p");
      p.innerText = noTexts[noIndex];
      document.getElementById("messages").appendChild(p);
      noIndex++;
    }
  }

  function yesClick() {
    document.getElementById("card").innerHTML = `
      <h1>Ur always my boboo 💖</h1>
      <p>(Unfortunately u lost ur freedom 😂🫣)</p>
      <img src="https://media.giphy.com/media/v6aOjy0Qo1fIA/giphy.gif" alt="cat kiss">
    `;
  }

  // floating hearts
  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💗";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 10 + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
  }, 400);
</script>

</body>
</html>
