<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💖</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      color: #fff;
      text-align: center;
    }

    .box {
      background: rgba(255, 255, 255, 0.15);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      max-width: 350px;
      width: 90%;
    }

    h1 {
      margin-bottom: 20px;
    }

    button {
      padding: 12px 25px;
      margin: 10px;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .yes {
      background: #ff4d6d;
      color: white;
    }

    .no {
      background: #fff;
      color: #ff4d6d;
    }

    button:hover {
      transform: scale(1.05);
    }

    img {
      max-width: 200px;
      border-radius: 15px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="box" id="content">
    <h1>Will you be my Valentine? 💘</h1>
    <button class="yes" onclick="yesClicked()">Yes 💖</button>
    <button class="no" onclick="noClicked()">No 💔</button>
  </div>

  <script>
    let noTexts = [
      "I hate u 😤",
      "stfu 🙄",
      "Promises don’t last 💔",
      "U broke myyy heart 😭"
    ];
    let noIndex = 0;

    function noClicked() {
      document.querySelector("h1").innerText = noTexts[noIndex];
      noIndex = (noIndex + 1) % noTexts.length;
    }

    function yesClicked() {
      document.body.style.background =
        "linear-gradient(135deg, #fbc2eb, #a6c1ee)";
      document.getElementById("content").innerHTML = `
        <h1>Ur always mine kannaa 💞</h1>
        <p>Forever & always 😘</p>
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbXk1eGJqZ3p0YXRjdnQ5aThqNWpxdml1eHk4Z2k0d2o3ZTRnczR2ZyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/gnXG2hODaCOru/giphy.gif" alt="kiss gif">
      `;
    }
  </script>

</body>
</html>
